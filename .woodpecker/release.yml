steps:
  release:
    image: redpencil/plugin-docker-buildx:latest
    pull: true
    settings:
      platforms:
        - linux/amd64
        - linux/arm64
      repo: "${CI_REPO_OWNER##mu-}/mu-${CI_REPO_NAME}"
      tags: "${CI_COMMIT_TAG##v}"
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password
      ssh_key:
        from_secret: ssh_key
when:
  - event: tag
    ref: refs/tags/v*
